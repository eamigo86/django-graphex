name: Documentation validation (manual)

# Production deployment happens only in cicd.yaml after a tagged PyPI release.
# This workflow builds a downloadable preview without changing GitHub Pages.
on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Set docs copyright year to the build year
        run: |
          sed -i -E "s/(Copyright &copy; )[0-9]{4}/\1$(date -u +%Y)/" zensical.yml

      - name: Build documentation
        run: uv run zensical build --clean -f zensical.yml

      - name: Upload documentation preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-preview
          path: ./site
