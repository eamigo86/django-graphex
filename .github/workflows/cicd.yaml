name: Continuous Integration & Delivery

on:
  push:
    branches:
    - main
    # Release tracker branches (e.g. v1.2.1) run the full test pipeline on every merge.
    - 'v*.*.*'
    tags:
    - 'v*.*.*'
  pull_request:
    branches:
    - main
    # PRs targeting a release tracker branch get the same checks as PRs to main.
    - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        # Python 3.12 — Django floor is >=5.2; supported: 5.2 LTS + 6.0
        - python-version: '3.12'
          toxenv: 'py312-django52'
        - python-version: '3.12'
          toxenv: 'py312-django60'
        # Python 3.13
        - python-version: '3.13'
          toxenv: 'py313-django52'
        - python-version: '3.13'
          toxenv: 'py313-django60'
        # Python 3.14
        - python-version: '3.14-dev'
          toxenv: 'py314-django52'
        - python-version: '3.14-dev'
          toxenv: 'py314-django60'

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        # Unique cache key per matrix combo: jobs sharing a key race to save it
        # (only one can reserve it -> "Unable to reserve cache" warnings).
        cache-suffix: ${{ matrix.toxenv }}

    - name: Run tests
      run: uvx --with tox-uv tox -e ${{ matrix.toxenv }}

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: failure()
      with:
        name: test-results-${{ matrix.toxenv }}
        path: .tox/*/log/

  base-install:
    # Proves the base install (no [subscriptions] extra) never imports channels.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        cache-suffix: base-install

    - name: Assert channels is absent without the extra
      run: uvx --with tox-uv tox -e base-install

  lint-and-security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        cache-suffix: lint-and-security

    - name: Run code quality checks
      run: uvx --with tox-uv tox -e quality

    - name: Run security checks
      run: uvx --with tox-uv tox -e security

  coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        cache-suffix: coverage

    - name: Run tests with coverage
      run: |
        uv sync --frozen
        # pytest addopts already enables pytest-cov (--cov + --cov-report=xml),
        # so plain pytest writes coverage.xml. A separate `coverage run` here
        # double-measures and leaves an empty .coverage (~0% reported).
        uv run pytest

    - name: Enforce changed-line coverage
      env:
        BASE_REF: ${{ github.base_ref || 'main' }}
      run: uvx 'diff-cover>=10.5.1,<11' coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=95.01

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: django_graphex
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d django_graphex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GDX_TEST_DATABASE: postgres
      POSTGRES_DB: django_graphex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        cache-suffix: postgresql

    - name: Run PostgreSQL transaction contracts
      run: |
        uv sync --frozen
        uv run python -c "import django; assert django.VERSION[:2] == (6, 0)"
        uv run pytest --no-migrations \
          tests/integration/test_postgresql_transactions.py --no-cov

  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Get version from pyproject.toml
      id: get_version
      run: |
        VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

        if [[ $VERSION =~ (alpha|beta|rc|dev) ]]; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi

        echo "Detected version: $VERSION"

    - name: Verify tag matches the package version
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        PACKAGE_VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${PACKAGE_VERSION}."
          exit 1
        fi
        echo "Tag matches package version: $PACKAGE_VERSION"

  release-artifact:
    needs: [ get-version ]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        cache-suffix: release-artifact

    - name: Build package once
      run: uv build

    - name: Require exactly one wheel and one sdist
      id: distribution
      run: |
        mapfile -t WHEELS < <(find dist -maxdepth 1 -type f -name '*.whl' | sort)
        mapfile -t SDISTS < <(find dist -maxdepth 1 -type f -name '*.tar.gz' | sort)
        test "${#WHEELS[@]}" -eq 1
        test "${#SDISTS[@]}" -eq 1
        echo "wheel=${WHEELS[0]}" >> "$GITHUB_OUTPUT"
        echo "sdist=${SDISTS[0]}" >> "$GITHUB_OUTPUT"

    - name: Smoke-test installed wheel outside checkout
      run: |
        SMOKE_ENV="$RUNNER_TEMP/django-graphex-wheel-smoke"
        SMOKE_CWD="$RUNNER_TEMP/django-graphex-wheel-cwd"
        uv venv "$SMOKE_ENV"
        uv pip install --python "$SMOKE_ENV/bin/python" "${{ steps.distribution.outputs.wheel }}"
        mkdir -p "$SMOKE_CWD"
        cd "$SMOKE_CWD"
        env -u PYTHONPATH "$SMOKE_ENV/bin/python" \
          "$GITHUB_WORKSPACE/scripts/check_wheel_install.py" "$GITHUB_WORKSPACE"

    - name: Audit prebuilt wheel dependencies
      run: |
        uv run --isolated --no-project --with 'pip>=25,<27' \
          --with 'pip-audit>=2.10.1,<3' \
          python scripts/release_audit.py "${{ steps.distribution.outputs.wheel }}"

    - name: Generate checksums
      run: |
        cd dist
        sha256sum \
          "$(basename '${{ steps.distribution.outputs.wheel }}')" \
          "$(basename '${{ steps.distribution.outputs.sdist }}')" \
          > SHA256SUMS

    - name: Upload immutable Python distribution
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: python-dist
        path: dist/*
        if-no-files-found: error

  docs-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        cache-suffix: docs-build

    - name: Install locked documentation dependencies
      run: uv sync --frozen

    - name: Set docs copyright year to the build year
      run: |
        sed -i -E "s/(Copyright &copy; )[0-9]{4}/\1$(date -u +%Y)/" zensical.yml

    - name: Build documentation
      run: uv run zensical build --clean -f zensical.yml

    - name: Setup Pages for a tagged release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

    - name: Upload tagged documentation artifact
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: ./site

  playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/playground
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        cache-suffix: playground

    - name: Run playground end-to-end tests
      run: uv run --group test pytest -q --no-migrations

  publish:
    needs: [ test, base-install, lint-and-security, coverage, postgresql, docs-build, playground, release-artifact, get-version ]
    runs-on: ubuntu-latest
    # Publish only when a version tag is pushed, or when triggered manually.
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}

    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        cache-suffix: publish

    - name: Download immutable Python distribution
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: python-dist
        path: dist

    - name: Verify distribution checksums
      run: cd dist && sha256sum -c SHA256SUMS

    - name: Publish to PyPI
      if: startsWith(github.ref, 'refs/tags/v')
      run: uv publish dist/*.whl dist/*.tar.gz --token ${{ secrets.PYPI_TOKEN }}

    - name: Publish to TestPyPI
      if: github.event_name == 'workflow_dispatch'
      run: uv publish dist/*.whl dist/*.tar.gz --publish-url https://test.pypi.org/legacy/ --token ${{ secrets.TESTPYPI_TOKEN }}

  create-release:
    needs: [ publish, get-version, release-artifact ]
    runs-on: ubuntu-latest
    # Only cut a GitHub Release for a real version tag.
    if: |
      needs.publish.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 0

    - name: Generate changelog
      id: changelog
      run: |
        VERSION="${{ needs.get-version.outputs.version }}"
        TAG_NAME="v$VERSION"

        PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sed -n '2p')

        if [ -z "$PREVIOUS_TAG" ]; then
          echo "No previous tag found, generating changelog from first commit"
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
        else
          echo "Generating changelog from $PREVIOUS_TAG to $TAG_NAME"
          CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
        fi

        if [ -z "$CHANGELOG" ]; then
          CHANGELOG="- Initial release"
        fi

        cat << EOF > changelog.md
        ## What's Changed

        $CHANGELOG

        ## Installation

        \`\`\`bash
        pip install django-graphex==$VERSION
        \`\`\`

        **Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...$TAG_NAME
        EOF

    - name: Download immutable Python distribution
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: python-dist
        path: dist

    - name: Verify distribution checksums
      run: cd dist && sha256sum -c SHA256SUMS

    - name: Create GitHub Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
      with:
        tag_name: v${{ needs.get-version.outputs.version }}
        name: Release v${{ needs.get-version.outputs.version }}
        body_path: changelog.md
        draft: false
        prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}
        files: |
          dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release summary
      run: |
        echo "✅ Release v${{ needs.get-version.outputs.version }} created successfully!"
        echo "🔗 https://github.com/${{ github.repository }}/releases/tag/v${{ needs.get-version.outputs.version }}"

  deploy-docs:
    # Deploy the artifact already built and validated before PyPI publication.
    needs: [ publish, docs-build ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
