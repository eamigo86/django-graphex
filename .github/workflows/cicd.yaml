name: Continuous Integration & Delivery

on:
  push:
    branches:
    - main
    # Release tracker branches (e.g. v1.2.1) run the full test pipeline on every merge.
    - 'v*.*.*'
    tags:
    - 'v*.*.*'
  pull_request:
    branches:
    - main
    # PRs targeting a release tracker branch get the same checks as PRs to main.
    - 'v*.*.*'
  workflow_dispatch:
    inputs:
      repository:
        description: "Choose repository to publish"
        required: true
        default: "testpypi"
        type: choice
        options:
        - testpypi
        - pypi

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        # Python 3.12 — Django floor is >=4.2 (SPEC OQ2)
        - python-version: '3.12'
          toxenv: 'py312-django42'
        - python-version: '3.12'
          toxenv: 'py312-django50'
        - python-version: '3.12'
          toxenv: 'py312-django51'
        - python-version: '3.12'
          toxenv: 'py312-django52'
        - python-version: '3.12'
          toxenv: 'py312-django60'
        # Python 3.13
        - python-version: '3.13'
          toxenv: 'py313-django42'
        - python-version: '3.13'
          toxenv: 'py313-django50'
        - python-version: '3.13'
          toxenv: 'py313-django51'
        - python-version: '3.13'
          toxenv: 'py313-django52'
        - python-version: '3.13'
          toxenv: 'py313-django60'
        # Python 3.14
        - python-version: '3.14-dev'
          toxenv: 'py314-django42'
        - python-version: '3.14-dev'
          toxenv: 'py314-django50'
        - python-version: '3.14-dev'
          toxenv: 'py314-django51'
        - python-version: '3.14-dev'
          toxenv: 'py314-django52'
        - python-version: '3.14-dev'
          toxenv: 'py314-django60'

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true
        # Unique cache key per matrix combo: jobs sharing a key race to save it
        # (only one can reserve it -> "Unable to reserve cache" warnings).
        cache-suffix: ${{ matrix.toxenv }}

    - name: Run tests
      run: uvx --with tox-uv tox -e ${{ matrix.toxenv }}

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: failure()
      with:
        name: test-results-${{ matrix.toxenv }}
        path: .tox/*/log/

  base-install:
    # Proves the base install (no [subscriptions] extra) never imports channels.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true
        cache-suffix: base-install

    - name: Assert channels is absent without the extra
      run: uvx --with tox-uv tox -e base-install

  lint-and-security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true
        cache-suffix: lint-and-security

    - name: Run code quality checks
      run: uvx --with tox-uv tox -e quality

    - name: Run security checks
      run: uvx --with tox-uv tox -e security

  coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true
        cache-suffix: coverage

    - name: Run tests with coverage
      run: |
        uv sync
        # pytest addopts already enables pytest-cov (--cov + --cov-report=xml),
        # so plain pytest writes coverage.xml. A separate `coverage run` here
        # double-measures and leaves an empty .coverage (~0% reported).
        uv run pytest

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true

  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Get version from pyproject.toml
      id: get_version
      run: |
        VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

        if [[ $VERSION =~ (alpha|beta|rc|dev) ]]; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi

        echo "Detected version: $VERSION"

  publish:
    needs: [ test, lint-and-security, coverage, get-version ]
    runs-on: ubuntu-latest
    # Publish only when a version tag is pushed, or when triggered manually.
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true
        cache-suffix: publish

    - name: Determine target repository
      id: target_repo
      run: |
        # A pushed tag publishes to PyPI; a manual run uses the chosen repo.
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          REPO="${{ github.event.inputs.repository }}"
        else
          REPO="pypi"
        fi

        echo "repository=$REPO" >> $GITHUB_OUTPUT
        echo "Publishing to: $REPO"

    - name: Verify the tag matches the package version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PKG_VERSION="${{ needs.get-version.outputs.version }}"
        if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${PKG_VERSION}."
          exit 1
        fi
        echo "Tag matches package version: $PKG_VERSION"

    - name: Build package
      run: uv build

    - name: Publish to PyPI
      if: steps.target_repo.outputs.repository == 'pypi'
      run: uv publish --token ${{ secrets.PYPI_TOKEN }}

    - name: Publish to TestPyPI
      if: steps.target_repo.outputs.repository == 'testpypi'
      run: uv publish --publish-url https://test.pypi.org/legacy/ --token ${{ secrets.TESTPYPI_TOKEN }}

  create-release:
    needs: [ publish, get-version ]
    runs-on: ubuntu-latest
    # Only cut a GitHub Release for a real version tag.
    if: |
      needs.publish.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 0

    - name: Generate changelog
      id: changelog
      run: |
        VERSION="${{ needs.get-version.outputs.version }}"
        TAG_NAME="v$VERSION"

        PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sed -n '2p')

        if [ -z "$PREVIOUS_TAG" ]; then
          echo "No previous tag found, generating changelog from first commit"
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
        else
          echo "Generating changelog from $PREVIOUS_TAG to $TAG_NAME"
          CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
        fi

        if [ -z "$CHANGELOG" ]; then
          CHANGELOG="- Initial release"
        fi

        cat << EOF > changelog.md
        ## What's Changed

        $CHANGELOG

        ## Installation

        \`\`\`bash
        pip install django-graphex==$VERSION
        \`\`\`

        **Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...$TAG_NAME
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
      with:
        tag_name: v${{ needs.get-version.outputs.version }}
        name: Release v${{ needs.get-version.outputs.version }}
        body_path: changelog.md
        draft: false
        prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}
        files: |
          dist/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release summary
      run: |
        echo "✅ Release v${{ needs.get-version.outputs.version }} created successfully!"
        echo "🔗 https://github.com/${{ github.repository }}/releases/tag/v${{ needs.get-version.outputs.version }}"

  deploy-docs:
    # Build and publish the documentation to GitHub Pages, but only after the
    # package was successfully published to PyPI for this version tag.
    needs: [ publish ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true
        cache-suffix: deploy-docs

    - name: Install dependencies
      run: uv sync

    - name: Build documentation
      run: uv run zensical build --clean -f zensical.yml

    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: ./site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
