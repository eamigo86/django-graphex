<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphQL Subscriptions Client</title>
<style>
  html,body{margin:0;height:100%;background:#0a101c;color:#cdd9e5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .gdsx-page{margin:0;padding:1.2rem;height:100vh;width:100%;display:flex;flex-direction:column;box-sizing:border-box}
  .gdsx-h{display:flex;align-items:baseline;gap:.6rem;margin:.2rem 0 1rem}
  .gdsx-h h1{font-size:1.6rem;margin:0;font-weight:700}
  .gdsx-h span{color:#7286a3;font-size:1rem}
  .gdsx-wrap{
    --bg:#0e1726;--panel:#0b1422;--panel2:#111d31;--line:#1e2d44;
    --txt:#cdd9e5;--muted:#7286a3;--accent:#e535ab;--accent2:#1ba8a0;
    --key:#e535ab;--str:#9effa5;--num:#f6c177;--bool:#7aa2f7;--null:#7286a3;
    color:var(--txt);background:var(--bg);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);
    display:flex;flex-direction:column;flex:1 1 auto;min-height:0
  }
  .gdsx-wrap *{box-sizing:border-box}
  .gdsx-top{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem .8rem;background:var(--panel2);border-bottom:1px solid var(--line)}
  .gdsx-pill{display:inline-flex;align-items:center;gap:.4rem;font-size:.84rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:.34rem .7rem;border-radius:999px;background:#172339;color:var(--muted);white-space:nowrap}
  .gdsx-dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--muted)}
  .gdsx-pill[data-state="open"]{color:#9effa5;background:rgba(40,140,90,.18)}
  .gdsx-pill[data-state="open"] .gdsx-dot{background:#36d399;box-shadow:0 0 8px #36d399}
  .gdsx-pill[data-state="connecting"]{color:#f6c177;background:rgba(170,130,40,.18)}
  .gdsx-pill[data-state="connecting"] .gdsx-dot{background:#f6c177;box-shadow:0 0 8px #f6c177;animation:gdsx-pulse 1s infinite}
  .gdsx-pill[data-state="closed"]{color:#ff8a8a;background:rgba(170,50,50,.16)}
  .gdsx-pill[data-state="closed"] .gdsx-dot{background:#ff6b6b}
  @keyframes gdsx-pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
  .gdsx-field{display:flex;align-items:center;gap:.35rem;flex:1 1 220px;min-width:160px}
  .gdsx-field label{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
  .gdsx-input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:.5rem .65rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9rem;min-width:0}
  .gdsx-input:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 2px rgba(27,168,160,.25)}
  .gdsx-btn{cursor:pointer;border:none;border-radius:7px;padding:.55rem 1rem;font-size:.92rem;font-weight:600;letter-spacing:.02em;transition:filter .15s,transform .05s}
  .gdsx-btn:active{transform:translateY(1px)}
  .gdsx-btn-primary{background:linear-gradient(135deg,var(--accent),#b3208a);color:#fff}
  .gdsx-btn-ghost{background:#1b2840;color:var(--txt)}
  .gdsx-btn:hover{filter:brightness(1.1)}
  .gdsx-seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .gdsx-seg-btn{cursor:pointer;border:none;padding:.45rem .85rem;font-size:.82rem;font-weight:600;background:#1b2840;color:var(--muted);letter-spacing:.03em;transition:background .1s,color .1s}
  .gdsx-seg-btn.active{background:var(--accent2);color:#fff}
  .gdsx-main{position:relative;display:grid;grid-template-columns:1fr 1fr;flex:1 1 auto;min-height:0}
  .gdsx-pane{display:flex;flex-direction:column;min-width:0;min-height:0}
  .gdsx-pane+.gdsx-pane{border-left:1px solid var(--line)}
  .gdsx-panehead{display:flex;align-items:center;justify-content:space-between;padding:.55rem .85rem;background:var(--panel);border-bottom:1px solid var(--line);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .gdsx-editor{flex:1;width:100%;border:none;resize:none;background:var(--panel);color:var(--txt);padding:.9rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92rem;line-height:1.6;tab-size:2}
  .gdsx-editor:focus{outline:none}
  .gdsx-ac{position:fixed;z-index:50;min-width:170px;max-height:240px;overflow:auto;background:#0c1626;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82rem;display:none}
  .gdsx-ac-item{padding:.3rem .65rem;cursor:pointer;display:flex;justify-content:space-between;gap:1.2rem;white-space:nowrap}
  .gdsx-ac-item .gdsx-ac-kind{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em}
  .gdsx-ac-item.sel{background:rgba(27,168,160,.2);color:#9effa5}
  .gdsx-out{flex:1;overflow:auto;padding:.7rem;background:var(--panel);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86rem;line-height:1.55}
  .gdsx-entry{border:1px solid var(--line);border-radius:8px;margin-bottom:.55rem;overflow:hidden;background:var(--panel2);animation:gdsx-in .25s ease}
  @keyframes gdsx-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .gdsx-entry-h{display:flex;align-items:center;gap:.5rem;padding:.35rem .55rem;background:#0c1626;border-bottom:1px solid var(--line)}
  .gdsx-badge{font-size:.64rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:.15rem .45rem;border-radius:5px}
  .gdsx-b-handshake{background:rgba(122,162,247,.2);color:#9db4ff}
  .gdsx-b-sent{background:rgba(229,53,171,.2);color:#ff8fd6}
  .gdsx-b-confirm{background:rgba(54,211,153,.18);color:#7defb7}
  .gdsx-b-notify{background:rgba(27,168,160,.2);color:#79e6df}
  .gdsx-b-complete{background:rgba(122,162,247,.15);color:#9db4ff}
  .gdsx-b-error{background:rgba(255,107,107,.2);color:#ff9d9d}
  .gdsx-time{margin-left:auto;color:var(--muted);font-size:.66rem}
  .gdsx-entry pre{margin:0;padding:.55rem;white-space:pre-wrap;word-break:break-word;overflow-x:auto}
  .gdsx-empty{color:var(--muted);text-align:center;padding:2.5rem 1rem;font-size:.8rem}
  .gdsx-key{color:var(--key)}.gdsx-str{color:var(--str)}.gdsx-num{color:var(--num)}.gdsx-bool{color:var(--bool)}.gdsx-null{color:var(--null)}
  .gdsx-fab{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--accent),#a01a7c);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(229,53,171,.45);z-index:5;transition:transform .12s,filter .15s}
  .gdsx-fab:hover{filter:brightness(1.12);transform:translate(-50%,-50%) scale(1.06)}
  .gdsx-fab:active{transform:translate(-50%,-50%) scale(.96)}
  .gdsx-fab[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}
  .gdsx-fab svg{width:24px;height:24px;margin-left:3px}
  @media(max-width:720px){.gdsx-main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.gdsx-pane+.gdsx-pane{border-left:none;border-top:1px solid var(--line)}.gdsx-fab{top:50%;bottom:auto}}
</style>
</head>
<body>
<div class="gdsx-page">
  <div class="gdsx-h"><h1>GraphQL Subscriptions Client</h1><span>django-graphex</span></div>
  <div class="gdsx-wrap" id="gdsx">
    <div class="gdsx-top">
      <span class="gdsx-pill" data-state="closed" id="gdsx-status"><span class="gdsx-dot"></span><span id="gdsx-status-txt">Disconnected</span></span>
      <!-- Transport mode selector: WS (graphql-transport-ws) or SSE (graphql-sse) -->
      <span class="gdsx-field" style="flex:0 0 auto">
        <label>Mode</label>
        <span class="gdsx-seg" id="gdsx-mode-seg">
          <button class="gdsx-seg-btn active" id="gdsx-mode-ws" type="button">WS</button>
          <button class="gdsx-seg-btn" id="gdsx-mode-sse" type="button">SSE</button>
        </span>
      </span>
      <!-- WS path (graphql-transport-ws endpoint) -->
      <span class="gdsx-field" id="gdsx-ws-field"><label>WS</label><input class="gdsx-input" id="gdsx-ws" spellcheck="false"></span>
      <!-- SSE path (graphql-sse / text/event-stream endpoint) -->
      <span class="gdsx-field" id="gdsx-sse-field" style="display:none"><label>SSE</label><input class="gdsx-input" id="gdsx-sse" spellcheck="false"></span>
      <!-- HTTP path for schema introspection autocomplete -->
      <span class="gdsx-field"><label>HTTP</label><input class="gdsx-input" id="gdsx-http" spellcheck="false"></span>
      <button class="gdsx-btn gdsx-btn-primary" id="gdsx-connect">Connect</button>
      <button class="gdsx-btn gdsx-btn-ghost" id="gdsx-clear">Clear</button>
    </div>
    <div class="gdsx-main">
      <div class="gdsx-pane">
        <div class="gdsx-panehead"><span>subscription</span><span id="gdsx-op-id" style="font-size:.76rem;color:var(--accent2)"></span></div>
        <textarea class="gdsx-editor" id="gdsx-query" spellcheck="false">subscription {
  # Replace with one of your subscriptions (see your schema).
  # Example:
  # postSubscription(action: ALL_ACTIONS) {
  #   id
  #   title
  # }
}</textarea>
      </div>
      <div class="gdsx-pane">
        <div class="gdsx-panehead"><span>output</span><span class="gdsx-time" id="gdsx-count">0 events</span></div>
        <div class="gdsx-out" id="gdsx-out"><div class="gdsx-empty">Choose WS or SSE, connect, then press &#9654; to start your subscription.</div></div>
      </div>
      <button class="gdsx-fab" id="gdsx-run" title="Send subscription (Ctrl/Cmd+Enter)" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
  </div>
</div>
<div class="gdsx-ac" id="gdsx-ac"></div>

<script>
(function(){
  "use strict";
  var root=document.getElementById("gdsx");
  if(!root||root.dataset.init) return; root.dataset.init="1";

  // ---- State -----------------------------------------------------------------
  var mode="ws";      // "ws" | "sse"
  var ws=null;        // active WebSocket (WS mode)
  var sse=null;       // active EventSource (SSE mode)
  var opId=null;      // current WS subscription id (string)
  var wsAcked=false;  // true after connection_ack received
  var count=0;
  var schemaCandidates=[];
  var opCounter=0;    // monotonic op id generator

  // ---- DOM shortcuts ---------------------------------------------------------
  var $=function(id){return document.getElementById(id);};
  var statusEl=$("gdsx-status"), statusTxt=$("gdsx-status-txt");
  var connectBtn=$("gdsx-connect"), runBtn=$("gdsx-run");
  var out=$("gdsx-out"), countEl=$("gdsx-count");
  var editor=$("gdsx-query"), ac=$("gdsx-ac");
  var wsField=$("gdsx-ws-field"), sseField=$("gdsx-sse-field");
  var opIdEl=$("gdsx-op-id");

  // ---- Endpoint defaults (same-origin, no CORS) ------------------------------
  var loc=window.location;
  var wsProto=loc.protocol==="https:"?"wss:":"ws:";
  $("gdsx-ws").value=wsProto+"//"+loc.host+"__WS_PATH__";
  $("gdsx-sse").value=loc.protocol+"//"+loc.host+"__HTTP_PATH__";
  $("gdsx-http").value=loc.protocol+"//"+loc.host+"__HTTP_PATH__";

  // ---- Utilities -------------------------------------------------------------
  function setStatus(state,label){
    statusEl.setAttribute("data-state",state);
    statusTxt.textContent=label;
  }
  function esc(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function highlight(value){
    var json=typeof value==="string"?value:JSON.stringify(value,null,2);
    json=esc(json);
    return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,function(m){
      var cls="gdsx-num";
      if(/^"/.test(m)){cls=/:$/.test(m)?"gdsx-key":"gdsx-str";}
      else if(/true|false/.test(m)){cls="gdsx-bool";}
      else if(/null/.test(m)){cls="gdsx-null";}
      return '<span class="'+cls+'">'+m+'</span>';
    });
  }
  function log(kind,label,payload){
    var empty=out.querySelector(".gdsx-empty"); if(empty) empty.remove();
    var entry=document.createElement("div"); entry.className="gdsx-entry";
    var time=new Date().toLocaleTimeString();
    var body=typeof payload==="string"?esc(payload):highlight(payload);
    entry.innerHTML='<div class="gdsx-entry-h"><span class="gdsx-badge gdsx-b-'+kind+'">'+label+'</span><span class="gdsx-time">'+time+'</span></div><pre>'+body+'</pre>';
    out.appendChild(entry); out.scrollTop=out.scrollHeight;
    count++; countEl.textContent=count+(count===1?" event":" events");
  }

  // ---- Mode selector ---------------------------------------------------------
  function setMode(m){
    mode=m;
    $("gdsx-mode-ws").className="gdsx-seg-btn"+(m==="ws"?" active":"");
    $("gdsx-mode-sse").className="gdsx-seg-btn"+(m==="sse"?" active":"");
    wsField.style.display=m==="ws"?"":"none";
    sseField.style.display=m==="sse"?"":"none";
    // Disconnect any active connection when switching modes.
    if(ws){ws.close();}
    if(sse){sse.close();sse=null;setStatus("closed","Disconnected");connectBtn.textContent="Connect";connectBtn.disabled=false;runBtn.disabled=true;}
  }
  $("gdsx-mode-ws").addEventListener("click",function(){setMode("ws");});
  $("gdsx-mode-sse").addEventListener("click",function(){setMode("sse");});

  // ==========================================================================
  // WS transport — graphql-transport-ws protocol
  // ==========================================================================
  // Subprotocol: "graphql-transport-ws"
  // Handshake: client sends connection_init → server sends connection_ack
  // Subscribe: client sends {type:"subscribe", id, payload:{query,variables}}
  //            server sends {type:"next", id, payload:{data,...}} per event
  //            server sends {type:"complete", id} when done
  //            client sends {type:"complete", id} to cancel
  // Ping/pong: server sends {type:"ping"} → client replies {type:"pong"}
  // ==========================================================================

  function wsSend(msg){
    if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify(msg));}
  }

  function wsConnect(){
    var url=$("gdsx-ws").value.trim(); if(!url) return;
    loadSchema();
    try{ws=new WebSocket(url,"graphql-transport-ws");}catch(e){log("error","WS Error",String(e));return;}
    setStatus("connecting","Connecting…");
    connectBtn.textContent="Connecting…"; connectBtn.disabled=true;
    wsAcked=false; opId=null; opIdEl.textContent="";

    ws.onopen=function(){
      // Send connection_init as the first message (graphql-transport-ws §4.1).
      wsSend({type:"connection_init"});
      log("handshake","connection_init","Sent connection_init — awaiting connection_ack…");
    };

    ws.onmessage=function(ev){
      var msg;
      try{msg=JSON.parse(ev.data);}catch(_){log("notify","Frame",ev.data);return;}
      var t=msg&&msg.type;
      if(t==="connection_ack"){
        wsAcked=true;
        connectBtn.textContent="Disconnect"; connectBtn.disabled=false;
        setStatus("open","Connected (WS)");
        runBtn.disabled=false;
        log("handshake","connection_ack",msg);
      } else if(t==="next"){
        log("notify","next",msg.payload||msg);
      } else if(t==="complete"){
        log("complete","complete",msg);
        runBtn.disabled=false;
        opId=null; opIdEl.textContent="";
      } else if(t==="error"){
        log("error","error",msg.payload||msg);
        runBtn.disabled=false;
        opId=null; opIdEl.textContent="";
      } else if(t==="ping"){
        // Respond to server pings with a pong (graphql-transport-ws §4.5).
        wsSend({type:"pong"});
        log("handshake","ping/pong","Received ping → sent pong");
      } else {
        log("notify","Frame",msg);
      }
    };

    ws.onerror=function(){
      log("error","WS Error","Could not reach "+$("gdsx-ws").value+". Is the server running?");
    };
    ws.onclose=function(ev){
      setStatus("closed","Disconnected");
      connectBtn.textContent="Connect"; connectBtn.disabled=false;
      runBtn.disabled=true;
      wsAcked=false; opId=null; opIdEl.textContent="";
      ws=null;
      if(ev.code!==1000&&ev.code!==1001){
        log("error","WS Closed","code "+ev.code+(ev.reason?" — "+ev.reason:""));
      }
    };
  }

  function wsDisconnect(){
    if(ws){
      // Send complete for the active op before closing (graphql-transport-ws §4.3).
      if(opId&&wsAcked){wsSend({type:"complete",id:opId});}
      ws.close(1000,"client disconnect");
    }
  }

  function wsRun(){
    if(!wsAcked){log("error","Error","WS not connected — connect first.");return;}
    var query=editor.value;
    opId=String(++opCounter);
    opIdEl.textContent="op: "+opId;
    var payload={query:query};
    wsSend({type:"subscribe",id:opId,payload:payload});
    log("sent","subscribe",{id:opId,query:query.substring(0,120)+(query.length>120?"…":"")});
    runBtn.disabled=true;
  }

  // ==========================================================================
  // SSE transport — graphql-sse (text/event-stream) protocol
  // https://github.com/enisdenjo/graphql-sse
  //
  // The server endpoint is an async Django view returning:
  //   Content-Type: text/event-stream
  //   event: next\ndata: {json}\n\n    — one per subscription event
  //   event: complete\ndata: \n\n      — terminal frame
  //
  // The client POSTs the GraphQL subscription query via HTTP first (fetch),
  // then opens an EventSource on the SSE endpoint URL. Because EventSource
  // only supports GET, django-graphex's SSE view accepts the subscription via
  // a query-string or body form depending on server config. For simplicity this
  // client sends the query via the URL query-string so EventSource can open it
  // directly (servers that require POST should use the "distinct connections"
  // mode from the graphql-sse spec — advanced usage, not this demo).
  //
  // Simpler approach used here: POST the query via fetch to the SSE endpoint
  // to start the stream, then read the response body as a stream of SSE frames.
  // This avoids the GET-only EventSource limitation and matches how the native
  // SSE view works (POST body carries query/variables/operationName).
  // ==========================================================================

  function sseConnect(){
    var url=$("gdsx-sse").value.trim(); if(!url) return;
    loadSchema();
    setStatus("connecting","Connecting…");
    connectBtn.textContent="Connecting…"; connectBtn.disabled=true;
    // Use EventSource for the SSE connection to the graphql-sse endpoint.
    // The query document is not sent here — it is sent when the user presses
    // the run button (per the graphql-sse distinct-connections mode: one
    // EventSource connection per subscription).
    // For demo purposes, open EventSource now to verify connectivity, and
    // send the subscription query when the user presses run.
    try{
      sse=new EventSource(url);
    }catch(e){log("error","SSE Error",String(e));setStatus("closed","Disconnected");connectBtn.textContent="Connect";connectBtn.disabled=false;return;}

    sse.onopen=function(){
      connectBtn.textContent="Disconnect"; connectBtn.disabled=false;
      setStatus("open","Connected (SSE)");
      runBtn.disabled=false;
      log("handshake","SSE Open","EventSource connected — ready to subscribe.");
    };
    sse.onerror=function(){
      log("error","SSE Error","EventSource connection error. Is the server running?");
      sse.close(); sse=null;
      setStatus("closed","Disconnected");
      connectBtn.textContent="Connect"; connectBtn.disabled=false;
      runBtn.disabled=true;
    };
    // Handle named SSE events per graphql-sse protocol.
    sse.addEventListener("next",function(ev){
      var data;try{data=JSON.parse(ev.data);}catch(_){data=ev.data;}
      log("notify","next",data);
    });
    sse.addEventListener("complete",function(){
      log("complete","complete","Stream completed.");
      sse.close(); sse=null;
      setStatus("closed","Disconnected");
      connectBtn.textContent="Connect"; connectBtn.disabled=false;
      runBtn.disabled=true;
    });
  }

  function sseDisconnect(){
    if(sse){sse.close();sse=null;}
    setStatus("closed","Disconnected");
    connectBtn.textContent="Connect"; connectBtn.disabled=false;
    runBtn.disabled=true;
  }

  function sseRun(){
    // SSE distinct-connections mode: send the subscription via HTTP POST to the
    // SSE endpoint; the server's StreamingHttpResponse carries event frames.
    // Close the current EventSource (it was opened just for connectivity check),
    // then POST the query and stream the response.
    if(sse){sse.close();sse=null;}
    var url=$("gdsx-sse").value.trim();
    var query=editor.value;
    log("sent","subscribe",{query:query.substring(0,120)+(query.length>120?"…":"")});
    runBtn.disabled=true;
    setStatus("connecting","Streaming…");

    fetch(url,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"text/event-stream,application/json"},
      body:JSON.stringify({query:query})
    }).then(function(resp){
      if(!resp.ok){
        return resp.text().then(function(t){log("error","HTTP "+resp.status,t);runBtn.disabled=false;setStatus("open","Connected (SSE)");});
      }
      setStatus("open","Streaming (SSE)");
      // Read the streaming SSE response body frame by frame.
      var reader=resp.body.getReader(), decoder=new TextDecoder();
      var buf="";
      function pump(){
        reader.read().then(function(chunk){
          if(chunk.done){
            log("complete","complete","Stream ended.");
            runBtn.disabled=false;
            setStatus("open","Connected (SSE)");
            return;
          }
          buf+=decoder.decode(chunk.value,{stream:true});
          // Parse SSE frames: each frame ends with \n\n
          var frames=buf.split("\n\n");
          buf=frames.pop(); // keep incomplete tail
          frames.forEach(function(frame){
            if(!frame.trim()) return;
            var eventType="message", dataLines=[];
            frame.split("\n").forEach(function(line){
              if(line.startsWith("event: ")){eventType=line.slice(7).trim();}
              else if(line.startsWith("data: ")){dataLines.push(line.slice(6));}
            });
            var raw=dataLines.join("\n");
            if(eventType==="next"){
              var data;try{data=JSON.parse(raw);}catch(_){data=raw;}
              log("notify","next",data);
            } else if(eventType==="complete"){
              log("complete","complete","Stream complete.");
              runBtn.disabled=false;
              setStatus("open","Connected (SSE)");
            }
          });
          pump();
        }).catch(function(err){log("error","Stream Error",String(err));runBtn.disabled=false;setStatus("open","Connected (SSE)");});
      }
      pump();
    }).catch(function(err){log("error","Fetch Error",String(err));runBtn.disabled=false;setStatus("open","Connected (SSE)");});
  }

  // ---- Unified connect / run -------------------------------------------------
  function connect(){
    if(mode==="ws"){wsConnect();}else{sseConnect();}
  }
  function disconnect(){
    if(mode==="ws"){wsDisconnect();}else{sseDisconnect();}
  }
  function run(){
    if(mode==="ws"){wsRun();}else{sseRun();}
  }

  // ---- Schema introspection (autocomplete) -----------------------------------
  function loadSchema(){
    var endpoint=$("gdsx-http").value.trim(); if(!endpoint) return;
    var q="{__schema{types{name kind fields{name args{name}}inputFields{name}enumValues{name}}}}";
    fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({query:q})})
      .then(function(r){return r.json();})
      .then(function(j){
        if(!j||!j.data||!j.data.__schema) return;
        var seen={}, cands=[];
        function add(name,kind){ if(!name||/^__/.test(name)) return; var k=name+"|"+kind; if(seen[k]) return; seen[k]=1; cands.push({name:name,kind:kind}); }
        (j.data.__schema.types||[]).forEach(function(t){
          if(/^__/.test(t.name)) return;
          add(t.name,"type");
          (t.fields||[]).forEach(function(f){ add(f.name,"field"); (f.args||[]).forEach(function(a){ add(a.name,"arg"); }); });
          (t.inputFields||[]).forEach(function(f){ add(f.name,"input"); });
          (t.enumValues||[]).forEach(function(v){ add(v.name,"enum"); });
        });
        ["subscription","mutation","query","fragment"].forEach(function(k){ add(k,"keyword"); });
        schemaCandidates=cands;
      })
      .catch(function(){ /* introspection optional */ });
  }

  // ---- Caret pixel position (for autocomplete popup) -------------------------
  function caretCoords(){
    var pos=editor.selectionStart, style=getComputedStyle(editor);
    var div=document.createElement("div");
    ["fontFamily","fontSize","fontWeight","lineHeight","letterSpacing","paddingTop","paddingRight","paddingBottom","paddingLeft","borderTopWidth","borderLeftWidth","tabSize"].forEach(function(p){ div.style[p]=style[p]; });
    div.style.position="absolute"; div.style.visibility="hidden"; div.style.whiteSpace="pre-wrap"; div.style.wordWrap="break-word"; div.style.boxSizing="border-box"; div.style.width=editor.clientWidth+"px";
    div.textContent=editor.value.substring(0,pos);
    var span=document.createElement("span"); span.textContent="​"; div.appendChild(span);
    document.body.appendChild(div);
    var rect=editor.getBoundingClientRect();
    var co={top:rect.top - editor.scrollTop + span.offsetTop, left:rect.left - editor.scrollLeft + span.offsetLeft, lh:parseFloat(style.lineHeight)||16};
    document.body.removeChild(div); return co;
  }

  // ---- Autocomplete ----------------------------------------------------------
  var acItems=[], acSel=0, acStart=-1;
  function currentWord(){
    var pos=editor.selectionStart, m=/[A-Za-z_][A-Za-z0-9_]*$/.exec(editor.value.substring(0,pos));
    return m ? {word:m[0], start:pos-m[0].length, end:pos} : null;
  }
  function closeAc(){ ac.style.display="none"; acItems=[]; }
  function openAc(){
    var w=currentWord();
    if(!w){ closeAc(); return; }
    var ql=w.word.toLowerCase();
    acItems=schemaCandidates.filter(function(c){ return c.name.toLowerCase().indexOf(ql)===0 && c.name!==w.word; }).slice(0,14);
    if(!acItems.length){ closeAc(); return; }
    acSel=0; acStart=w.start;
    ac.innerHTML=acItems.map(function(c,i){ return '<div class="gdsx-ac-item'+(i===0?' sel':'')+'" data-i="'+i+'">'+esc(c.name)+'<span class="gdsx-ac-kind">'+c.kind+'</span></div>'; }).join("");
    var co=caretCoords();
    ac.style.top=(co.top+co.lh+3)+"px"; ac.style.left=co.left+"px"; ac.style.display="block";
  }
  function acAccept(){
    if(!acItems.length) return false;
    var name=acItems[acSel].name, pos=editor.selectionStart, val=editor.value;
    editor.value=val.substring(0,acStart)+name+val.substring(pos);
    editor.selectionStart=editor.selectionEnd=acStart+name.length;
    closeAc(); return true;
  }
  function acMove(d){
    acSel=(acSel+d+acItems.length)%acItems.length;
    Array.prototype.forEach.call(ac.children,function(el,i){ el.className="gdsx-ac-item"+(i===acSel?" sel":""); });
    if(ac.children[acSel]) ac.children[acSel].scrollIntoView({block:"nearest"});
  }
  ac.addEventListener("mousedown",function(e){
    var item=e.target.closest(".gdsx-ac-item"); if(!item) return;
    e.preventDefault(); acSel=parseInt(item.getAttribute("data-i"),10); acAccept(); editor.focus();
  });

  // ---- Tab indentation -------------------------------------------------------
  var IND="  ";
  function indent(){
    var s=editor.selectionStart, e=editor.selectionEnd, val=editor.value;
    if(s===e){ editor.value=val.substring(0,s)+IND+val.substring(e); editor.selectionStart=editor.selectionEnd=s+IND.length; return; }
    var ls=val.lastIndexOf("\n",s-1)+1, seg=val.substring(ls,e).replace(/^/gm,IND);
    editor.value=val.substring(0,ls)+seg+val.substring(e);
    editor.selectionStart=s+IND.length; editor.selectionEnd=e+(seg.length-(val.substring(ls,e).length));
  }
  function outdent(){
    var s=editor.selectionStart, e=editor.selectionEnd, val=editor.value;
    var ls=val.lastIndexOf("\n",s-1)+1, seg=val.substring(ls,e), newSeg=seg.replace(/^( {1,2}|\t)/gm,"");
    editor.value=val.substring(0,ls)+newSeg+val.substring(e);
    editor.selectionStart=Math.max(ls,s-IND.length); editor.selectionEnd=e-(seg.length-newSeg.length);
  }

  // ---- Event wiring ----------------------------------------------------------
  editor.addEventListener("input",openAc);
  editor.addEventListener("blur",function(){ setTimeout(closeAc,120); });

  connectBtn.addEventListener("click",function(){ if(ws||(sse&&sse.readyState!==EventSource.CLOSED)){disconnect();}else{connect();} });
  runBtn.addEventListener("click",run);
  $("gdsx-clear").addEventListener("click",function(){out.innerHTML='<div class="gdsx-empty">Cleared. Press &#9654; to send your subscription.</div>';count=0;countEl.textContent="0 events";});
  $("gdsx-http").addEventListener("change",loadSchema);
  editor.addEventListener("keydown",function(e){
    if(ac.style.display==="block" && acItems.length){
      if(e.key==="ArrowDown"){e.preventDefault();acMove(1);return;}
      if(e.key==="ArrowUp"){e.preventDefault();acMove(-1);return;}
      if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();acAccept();return;}
      if(e.key==="Escape"){e.preventDefault();closeAc();return;}
    }
    if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();run();return;}
    if(e.key==="Tab"){e.preventDefault();e.shiftKey?outdent():indent();return;}
    if(e.ctrlKey&&e.key===" "){e.preventDefault();openAc();return;}
  });

  loadSchema();
})();
</script>
</body>
</html>
