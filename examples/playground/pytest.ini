[pytest]
# Standalone pytest config for the PLAYGROUND project. It runs under the
# playground's own Django settings (config.settings), NOT the library's tests/
# settings. Run it from this directory:
#
#     cd examples/playground
#     DJANGO_SETTINGS_MODULE=config.settings python -m pytest -q --no-migrations
#
# (the DJANGO_SETTINGS_MODULE below makes the env var optional, but the explicit
# form is the documented invocation.)
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
