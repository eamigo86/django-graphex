[project]
name = "gde-playground"
version = "0.0.0"
description = "Local playground to try django-graphex features end to end."
requires-python = ">=3.12,<4.0"
dependencies = [
    # The library itself (from the parent repo) with the subscriptions extra.
    "django-graphex[subscriptions]",
    # ASGI server so HTTP + WebSocket (subscriptions) work together.
    "daphne>=4.0",
]

# Test-only deps for the playground's end-to-end suite (tests/). These are the
# SAME tools the library's own dev extra already pins (pytest / pytest-django /
# pytest-asyncio); channels + daphne come from the library's [subscriptions]
# extra above. Run with `make test` (or `uv run --group test pytest -q
# --no-migrations`). The pytest config lives in ./pytest.ini.
[dependency-groups]
test = [
    "pytest>=9.0.0,<10",
    "pytest-django>=4.5.0,<5",
    "pytest-asyncio>=1.0,<2",
]

[tool.uv.sources]
# Use the local checkout of the library (editable) so you test your changes.
# `dependencies` above only says *what* is required; this says *where* it comes
# from -- so `make install` installs the library from this repo checkout,
# editable, NOT from PyPI. No published release is needed.
django-graphex = { path = "../..", editable = true }
# To install from GitHub instead (e.g. outside this repo), swap the line above
# for:
#   django-graphex = { git = "https://github.com/eamigo86/django-graphex.git", branch = "main" }

# This playground is NOT a publishable package — it is a local example project.
# The [tool.hatch.build.targets.wheel] section is required by hatchling to
# locate the source directories when uv installs this project in editable mode
# (via [tool.uv.sources] above). Without it hatchling cannot determine which
# files to include and will error. Removing this section would break `make install`.
[tool.hatch.build.targets.wheel]
packages = ["config", "blog"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
