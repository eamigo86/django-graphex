[tox]
isolated_build = true
# Django floor is >=5.2 (4.2/5.0/5.1 are EOL). Supported: 5.2 LTS + 6.0.
envlist =
    py312-django{52,60}
    py313-django{52,60}
    py314-django{52,60}
    base-install
    quality
    security
    build
    docs

[testenv]
description = Run tests with the [subscriptions] extra (channels installed)
setenv =
    PYTHONPATH = {toxinidir}
deps =
    pytest
    pytest-django
    pytest-asyncio
    pytest-cov
    factory_boy
    coverage[toml]
    # [subscriptions] extra — exercises the subscription suite across the matrix
    channels>=4.0,<5.0
    daphne>=4.0,<5.0
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<7.0
commands =
    # pyproject.toml [tool.pytest.ini_options] addopts already carries the full
    # --cov config (--cov=django_graphex, --cov-branch, --cov-report=...).
    # Do NOT add --cov flags here; duplicating them triggers a pytest-cov warning.
    # --cov-fail-under=0 overrides the 95% floor from pyproject.toml addopts:
    # the matrix envs install a smaller set of dev tools so a handful of tests
    # are skipped and coverage sits just below 95%; the floor is enforced in the
    # local dev venv (pytest run) and the dedicated coverage CI step instead.
    pytest tests/ --cov-fail-under=0

[testenv:base-install]
description = Base install must stay channels-free (no [subscriptions] extra)
setenv =
    PYTHONPATH = {toxinidir}
deps =
    pytest
    pytest-django
    # pytest-asyncio is a TEST tool (not channels) — present so the
    # asyncio_mode=auto pytest config is recognised and emits no warning; the
    # async subscription tests still auto-skip without the [subscriptions] extra.
    pytest-asyncio
    pytest-cov
    factory_boy
    coverage[toml]
    Django>=5.2,<6.0
commands =
    # 1) prove channels is absent and the base import never pulls it in
    python scripts/check_base_install.py
    # 2) the rest of the suite still passes (subscription tests auto-skip);
    #    --cov-fail-under=0 overrides the 95% floor from pyproject.toml addopts
    #    because subscriptions code is intentionally uncovered without the extra.
    pytest tests/ -p no:cacheprovider --cov-fail-under=0

[testenv:quality]
description = Code quality checks (ruff format + ruff lint + mypy)
skip_install = true
deps =
    # Pinned for the same reason as mypy/bandit: unpinned resolutions differ
    # between cached PR runs and fresh push runs; bump deliberately.
    ruff==0.15.17
    # Pinned: unpinned mypy resolved differently between cached PR runs and
    # fresh push runs, letting a signature error slip through PR CI. Bump deliberately.
    mypy==2.1.0
    types-python-dateutil
commands =
    ruff format --check .
    ruff check .
    mypy django_graphex

[testenv:security]
description = Security checks (bandit, safety)
skip_install = true
deps =
    # Pinned for the same reason as mypy in [testenv:quality]: unpinned
    # resolutions differ between cached PR runs and fresh push runs.
    bandit==1.9.4
    pip-audit
commands =
    bandit -r django_graphex/ -c pyproject.toml
    pip-audit

[testenv:build]
description = Build the package with uv (hatchling backend)
skip_install = true
allowlist_externals = uv
commands =
    uv build

[testenv:docs]
description = Build the documentation with Zensical
skip_install = true
deps =
    zensical>=0.0.44
commands =
    zensical build --clean -f zensical.yml

[gh-actions]
python =
    3.12: py312-django52, py312-django60
    3.13: py313-django52, py313-django60
    3.14: py314-django52, py314-django60
