[project]
name = "django-graphex"
version = "2.0.0"
description = "GraphQL for Django, powered by graphql-core and Pydantic: define types/mutations/subscriptions from your models, with nested filtering (and/or/not), pagination, permissions and directives."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "MIT"
authors = [
    { name = "Ernesto Perez Amigo", email = "eamigop86@gmail.com" },
]
keywords = ["api", "graphql", "protocol", "django"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "django>=5.2,<7.0",
    "python-dateutil>=2.8.2,<3.0",
    "graphql-core>=3.2.11,<3.3",
    "text-unidecode>=1.3,<2.0",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
# Optional: only installed with the `subscriptions` extra. The base install must
# never pull in channels (see django_graphex/subscriptions/__init__.py).
subscriptions = [
    "channels>=4.0,<5.0",
    "channels-redis>=4.2,<5.0",
]

[project.urls]
Homepage = "https://github.com/eamigo86/django-graphex"
Repository = "https://github.com/eamigo86/django-graphex"
Documentation = "https://eamigo86.github.io/django-graphex/"

[dependency-groups]
dev = [
    # Testing
    "pytest>=9.1.0,<10",
    "pytest-django>=4.5.0,<5",
    "pytest-cov>=7.0.0,<8",
    "pytest-asyncio>=1.0,<2",
    "factory-boy>=3.3.0,<4",
    # Subscriptions (optional extra) — needed to exercise the subscription suite
    "channels>=4.0,<5.0",
    "daphne>=4.0,<5.0",  # provides channels.testing helpers (WebsocketCommunicator)
    # daphne pulls cryptography transitively; pin past GHSA-537c-gmf6-5ccf
    # (vulnerable 48.0.0; fixed 48.0.1) so a clean dev install resolves the fix.
    # Upper bound <49 keeps pyopenssl (requires cryptography<49) consistent.
    "cryptography>=48.0.1,<49",
    # Code quality (ruff = formatter + linter; mypy = types)
    "ruff>=0.15.17,<1",
    "mypy>=2.1,<3",
    "types-python-dateutil>=2.9.0,<3",
    # Security
    "bandit>=1.9.0,<2",
    "pip-audit>=2.10.1,<3",
    # Development tools
    "tox>=4.34.0,<5",
    "tox-gh-actions>=3.5.0,<4",
    "ipdb>=0.13.13",
    "ipython>=9.9.0,<10",
    # Documentation (Zensical: successor to MkDocs by the Material team; config in zensical.yml)
    "zensical>=0.0.44",
    # Coverage
    "coverage[toml]>=7.13.0,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_graphex"]

[tool.hatch.build.targets.sdist]
# Allowlist: only ship the library source, tests, docs assets and distribution
# metadata. This prevents dev-local paths (.claude/, specs/) from leaking into
# the published tarball even if they are not in .gitignore.
include = [
    "/django_graphex",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations", "build", "dist", ".venv", ".tox"]

[tool.ruff.lint]
# Mirror the previous flake8 active rule set (E,W,F + docstrings D) plus import
# sorting (I, replacing isort). `ruff format` is black-compatible at length 88.
select = ["E", "W", "F", "D", "I"]
# E203/E501 handled by the formatter; D417 (undocumented param) was not enforced
# by the prior flake8 google convention -- keep the migration behavior-equivalent.
ignore = ["E203", "E501", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["django_graphex"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["D"]
"examples/*" = ["D"]

[tool.coverage.run]
source = ["django_graphex"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/venv/*",
    "*/.tox/*",
    "*/setup.py",
    "*/manage.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",
    "@(abc\\.)?abstractmethod"
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = [
    "B101",  # Skip assert_used test - asserts are OK in library code for validation
    "B311",  # Skip random - not used for security purposes
    "B324",  # Skip MD5 - used for cache keys, not cryptographic security
]

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_tests.py", "bench_*.py"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov-branch",
    "--no-cov-on-fail",
    "--cov=django_graphex",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=95",
    "--ignore=tests/spike"
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = false
warn_unused_configs = false
show_error_codes = false
strict_optional = false
disable_error_code = ["union-attr", "attr-defined", "assignment", "var-annotated", "misc", "valid-type", "return", "return-value", "list-item", "index", "arg-type"]
