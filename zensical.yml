site_name: django-graphex
site_description: GraphQL for Django powered by graphql-core and Pydantic — types, mutations, subscriptions, nested filtering, pagination and directives
site_author: Ernesto Perez Amigo
site_url: https://eamigo86.github.io/django-graphex/

repo_name: eamigo86/django-graphex
repo_url: https://github.com/eamigo86/django-graphex
edit_uri: edit/main/docs/

theme:
  name: material
  # Keep the Material for MkDocs look & feel under Zensical (vs. the new "modern" default).
  variant: classic
  palette:
    # Light mode is the default (first entry); the toggle switches to dark.
    # No `media` query, so it does not follow the OS dark/light preference.
    - scheme: default
      primary: light blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode (opt-in via the toggle)
    - scheme: slate
      primary: light blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.tabs.link
    - content.code.copy
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  # Render inline icons/emoji like :material-star: (Zensical bundles the icon sets
  # and extends pymdownx.emoji; the zensical.* namespace is required for icon SVGs).
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: quickstart.md
    - Why graphex?: why.md
    - Migration Guide: migration.md
  - User Guide:
    - Settings: usage/settings.md
    - Views: usage/views.md
    - Fields: usage/fields.md
    - Types: usage/types.md
    - Model Backend: usage/backends.md
    - Mutations: usage/mutations.md
    - Pagination: usage/pagination.md
    - Filtering: usage/filtering.md
    - Permissions: usage/permissions.md
    - Permission-Scoped Access: usage/permission-scoped-schema.md
    - Query Optimization: usage/query-optimization.md
    - Nested Lists: usage/nested-lists.md
    - Directives: directives.md
    - Subscriptions: usage/subscriptions.md
    - Query Limits: usage/query-limits.md
    - Caching: usage/caching.md
    - Security: usage/security.md
  - Examples & Recipes:
    - Playground Project: usage/examples/playground.md
    - Sample Application: usage/examples/blog-schema.md
    - Query Recipes: usage/examples/queries.md
    - Mutation Recipes: usage/examples/mutations.md
    - Directive Recipes: usage/examples/directives.md
    - Frontend (React + Apollo): usage/examples/frontend.md
    - Performance Tips: usage/examples/performance.md
  - API Reference:
    - Fields: api/fields.md
    - Types: api/types.md
    - Mutations: api/mutations.md
    - Paginations: api/paginations.md
    - Directives: api/directives.md
  - Development:
    - Contributing: contributing.md
    - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eamigo86/django-graphex
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/django-graphex/

copyright: Copyright &copy; 2026 Ernesto Perez Amigo
